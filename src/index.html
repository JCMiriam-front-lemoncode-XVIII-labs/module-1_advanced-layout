<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141414" />
    <title>Lemonspace</title>
    <link rel="icon" type="image/svg+xml" href="/images/lemonspace-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <a class="skip-link" href="#catalogo">Saltar al catálogo</a>
    <header class="site-header">
      <a class="brand" href="#inicio" aria-label="Lemonspace, inicio">
        <img
          class="brand__logo"
          src="/images/lemonspace-logo.svg"
          alt=""
          width="377"
          height="298"
        />
        <span class="brand__name">Lemonspace</span>
      </a>
      <nav aria-label="Navegación principal">
        <a class="nav-link" href="#inicio">Inicio</a>
      </nav>
      <div class="header-search" role="search" aria-label="Buscar en el catálogo">
        <label class="visually-hidden" for="catalog-search">Buscar películas</label>
        <svg class="header-search__icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.5" />
          <path d="m16 16 4 4" />
        </svg>
        <input
          class="header-search__input"
          id="catalog-search"
          type="search"
          placeholder="Buscar películas…"
          autocomplete="off"
          aria-controls="catalogo"
        />
      </div>
    </header>
    <main class="catalog" id="inicio">
      <p class="search-status" role="status" aria-live="polite"></p>
      <div id="catalogo" tabindex="-1">
        {% include "./src/components/catalog/catalog.html" %}
      </div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
